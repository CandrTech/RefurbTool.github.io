<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone stickermaker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#eef1f4;--ink:#16202a;--card:#fff;--line:#cfd6dd;--accent:#0a63c9;--muted:#5d6b78}
@media (prefers-color-scheme:dark){:root{--bg:#12171c;--ink:#e8edf2;--card:#1c242c;--line:#33414d;--accent:#4aa3ff;--muted:#93a1ae}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:max(12px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto}
h1{font-size:1.4rem;margin:8px 0 14px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
h2{font-size:1rem;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:3px}
label.full{grid-column:1/-1}
input,select{font-size:16px;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font-size:1rem;padding:11px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;flex:1;min-width:140px}
button.sec{background:transparent;color:var(--accent)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
button.tab{background:transparent;color:var(--accent);min-width:0;padding:10px 6px}
button.tab.on{background:var(--accent);color:#fff}
#q{font-size:16px;padding:12px;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#qres{margin-top:8px;display:flex;flex-direction:column;gap:6px}
#qres:empty{display:none}
#qres button{display:flex;justify-content:space-between;gap:8px;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:500;font-size:.95rem;padding:10px 12px;min-width:0;flex:none}
#qres small{color:var(--muted);white-space:nowrap}
.preview{overflow-x:auto;padding:6px 0}
/* ---------- sticker ---------- */
#sticker{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;position:relative;overflow:hidden;border:1px solid #000;display:flex;gap:2mm;padding:2.5mm;line-height:1.25;font-size:3.4mm}
#sticker .left{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
#sticker .title{font-size:5.2mm;font-weight:800;line-height:1.1}
#sticker .row{display:flex;gap:2mm;flex-wrap:wrap}
#sticker .row span{white-space:nowrap}
#sticker b{font-weight:700}
#sticker .tag{display:inline-block;background:#000;color:#fff;padding:.2mm 1.4mm;border-radius:.8mm;font-weight:700}
#sticker .right{display:flex;flex-direction:column;align-items:center;justify-content:center;width:26mm}
#sticker .gb{background:#1a8fd8;color:#fff;font-weight:800;font-size:5mm;padding:2mm 2.5mm;text-align:center;width:100%}
#sticker svg{width:100%;height:auto;max-height:14mm}
#sticker .cp,#sticker .tb,#sticker .gr,#sticker .mn{width:100%;display:flex;flex-direction:column;min-width:0}
#sticker .cp-t{font-size:5.4mm;font-weight:800;line-height:1.1}
#sticker .cp-s{font-size:3.6mm;margin-top:.5mm}
#sticker .cp-chips{display:flex;flex-wrap:wrap;gap:1mm;margin-top:1.5mm}
#sticker .cp-chips i{font-style:normal;border:.3mm solid #000;border-radius:1mm;padding:.2mm 1.2mm;font-size:3.1mm}
#sticker .cp-b{margin-top:auto;text-align:center}
#sticker .cp-b svg{width:100%;height:11mm;max-height:none;display:block}
#sticker .cp-sr{font-size:2.8mm;letter-spacing:.3mm;margin-top:.5mm}
#sticker .tb-h{background:#000;color:#fff;font-weight:800;font-size:4.6mm;padding:1.3mm 2.5mm;margin:-2.5mm -2.5mm 1.5mm}
#sticker .tb-body{display:flex;gap:2mm;flex:1;min-height:0}
#sticker .tb-g{flex:1;display:grid;grid-template-columns:auto 1fr;gap:.4mm 2mm;align-content:start;font-size:3.1mm}
#sticker .tb-g span{color:#444}
#sticker .tb-r{width:26mm;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:2.6mm}
#sticker .tb-r svg{height:14mm;max-height:none}
#sticker .gr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:2mm}
#sticker .gr-t{font-size:6.2mm;font-weight:900;line-height:1.05}
#sticker .gr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2mm;margin-top:1.5mm}
#sticker .gr-stats div{border:.4mm solid #000;border-radius:1.2mm;padding:.8mm 1mm;text-align:center}
#sticker .gr-stats small{display:block;font-size:2.4mm;color:#444;text-transform:uppercase}
#sticker .gr-stats b{font-size:4.2mm}
#sticker .gr-bot{display:flex;gap:2mm;margin-top:auto;align-items:flex-end}
#sticker .gr-info{flex:1;font-size:3mm;line-height:1.3}
#sticker .gr-bc{width:34mm;text-align:center;font-size:2.4mm}
#sticker .gr-bc svg{height:10mm;max-height:none}
#sticker .mn{align-items:center;justify-content:center;text-align:center;gap:1mm}
#sticker .mn-t{font-size:6mm;font-weight:800;line-height:1.1}
#sticker .mn-s{font-size:3.8mm}
#sticker .mn svg{width:70%;height:12mm;max-height:none}
#sticker .mn-sr{font-size:3mm;letter-spacing:.4mm}
#sticker .bcwrap{width:100%;text-align:center;font-size:2.6mm}
@media print{
 body{background:#fff;padding:0}
 main>*:not(.printzone){display:none!important}
 .printzone,.printzone section{border:0;padding:0;margin:0;background:none}
 .printzone h2,.printzone .btns{display:none}
 .preview{overflow:visible}
 #sticker{border:0}
}
</style>
</head>
<body>
<main>
<h1>iPhone stickermaker</h1>

<section>
 <input id="q" type="search" placeholder="Zoek model, A-nummer of SM-nummer (bijv. 13 pro, A54, S23)" autocomplete="off" enterkeyhint="search">
 <div id="qres"></div>
</section>

<section>
 <div class="tabs">
  <button type="button" class="tab" data-cat="iPhone">iPhone</button>
  <button type="button" class="tab" data-cat="Samsung">Samsung</button>
  <button type="button" class="tab" data-cat="MacBook">MacBook</button>
  <button type="button" class="tab" data-cat="Anders">Anders</button>
 </div>
 <input type="hidden" id="cat" value="iPhone">
 <h2>Gegevens</h2>
 <div class="grid">
  <label class="full">Model<select id="model"></select></label>
  <label class="full" id="modelOtherL" hidden>Eigen model<input id="modelOther"></label>
  <label>Opslag<select id="storage"><option value="64">64 GB</option><option value="128">128 GB</option><option value="256">256 GB</option><option value="512">512 GB</option><option value="1024">1 TB</option><option value="2048">2 TB</option><option value="4096">4 TB</option><option value="8192">8 TB</option></select></label>
  <label>Kleur<select id="color"></select></label>
  <label id="colorOtherL" hidden>Eigen kleur<input id="colorOther"></label>
  <label>Modelnummer<input id="mnum" value="MLMT3LL/A"></label>
  <label>A-nummer<input id="anum" value="A2482"></label>
  <label class="full">Serienummer (komt als barcode)<input id="serial" value="M70YYOJNW3" autocapitalize="characters"></label>
  <label>iOS-versie<input id="ios" value="18.3.1" inputmode="decimal"></label>
  <label>Batterij %<input id="batt" value="99" inputmode="numeric"></label>
  <label>FMI<select id="fmi"><option>Off</option><option>On</option></select></label>
  <label>SIM<select id="sim"><option>Unlocked</option><option>Locked</option></select></label>
  <label>Processor<input id="chip" value="M2"></label>
  <label>RAM<select id="ram"><option value="8">8 GB</option><option value="16">16 GB</option><option value="18">18 GB</option><option value="24">24 GB</option><option value="32">32 GB</option><option value="36">36 GB</option><option value="48">48 GB</option><option value="64">64 GB</option><option value="96">96 GB</option><option value="128">128 GB</option></select></label>
  <label>Batterijcycli<input id="cycles" inputmode="numeric"></label>
  <label class="full">Gerepareerd?<select id="rep"><option value="No">Nee</option><option value="Yes - OEM parts">Ja - OEM onderdelen</option><option value="Yes - Original parts">Ja - Originele onderdelen</option></select></label>
  <label>Datum<input id="date" type="date"></label>
  <label>Grade / conditie<input id="grade" value="Working Phone"></label>
  <label>Locatie / code<input id="loc" value="PC-14"></label>
  <label>Aantal<input id="qty" value="1" inputmode="numeric"></label>
 </div>
</section>

<section>
 <h2>Ontwerp en formaat</h2>
 <div class="grid">
  <label class="full">Ontwerp<select id="lay"><option value="klassiek">Klassiek</option><option value="compact">Compact</option><option value="tabel">Tabel</option><option value="groot">Groot</option><option value="minimaal">Minimaal</option></select></label>
  <label>Breedte (mm)<input id="w" value="100" inputmode="numeric"></label>
  <label>Hoogte (mm)<input id="h" value="50" inputmode="numeric"></label>
 </div>
</section>

<section class="printzone">
 <h2>Voorbeeld</h2>
 <div class="preview"><div id="sticker"></div></div>
 <div class="btns" style="margin-top:10px">
  <button id="saveImg">Opslaan als afbeelding</button>
  <button id="pdf" class="sec">Print / PDF</button>
 </div>
 <p style="font-size:.8rem;color:var(--muted);margin:10px 0 0">Op iPhone: tik op “Opslaan als afbeelding” en kies “Bewaar afbeelding” of open direct je sticker-app. De velden worden onthouden op dit toestel.</p>
</section>
</main>

function modelList(){
  const c=$("cat").value;
  if(c==="iPhone") return IPHONES.map(m=>"Apple iPhone "+m+" · "+IPH_A[m]);
  if(c==="Samsung") return Object.keys(SAMSUNG).map(m=>"Samsung "+m+" · "+SM_NR[m.replace("Galaxy ","")]);
  if(c==="MacBook") return Object.keys(MAC).map(m=>"Apple "+m);
  return [];
}
function colorList(m){
  const c=$("cat").value;
  if(c==="iPhone") return COLORS[m.split(" · ")[0].replace("Apple iPhone ","")]||[];
  if(c==="Samsung") return SAMSUNG[m.split(" · ")[0].replace("Samsung ","")]||[];
  if(c==="MacBook") return MAC[m.replace("Apple ","")]||[];
  return [];
}
function fillModels(){
  const sel=$("model"), old=sel.value, list=modelList();
  sel.innerHTML=list.map(m=>`<option>${m}</option>`).join("");
  sel.value = list.includes(old)||old==="__other" ? old : (list[0]||"__other");
}
function fillColors(){
  const list=colorList($("model").value);
  const sel=$("color"), old=sel.value;
  sel.innerHTML=list.map(c=>`<option>${c}</option>`).join("");
  sel.value = list.includes(old)||old==="__other" ? old : (list[0]||"__other");
}
function autoA(){
  const c=$("cat").value;
  const m=$("model").value, i=m.indexOf(" · ");
  if(i<0) return;
  const nr=m.slice(i+3);
  if(c==="Samsung") $("mnum").value=nr; else if(c==="iPhone"||c==="MacBook") $("anum").value=nr;
}
function setLabel(id,t){ $(id).parentElement.firstChild.nodeValue=t; }
function setSel(id,val){ const el=$(id); if([...el.options].some(o=>o.value===val)) el.value=val; }
// laden
try{ const s = JSON.parse(localStorage.getItem(KEY)||"{}"); ids.forEach(i=>{ if(s[i]!==undefined) $(i).value=s[i]; }); }catch(e){}
try{ const sv = JSON.parse(localStorage.getItem(KEY)||"{}"); fillModels(); if(sv.model) setSel("model",sv.model); fillColors(); if(sv.color) setSel("color",sv.color); }catch(e){ fillModels(); fillColors(); }
if(!$("date").value) $("date").value = new Date().toISOString().slice(0,10);

function fmtDate(v){ if(!v) return ""; const [y,m,d]=v.split("-"); return d+"/"+m+"/"+y; }

function render(){
  const v = {}; ids.forEach(i=>v[i]=$(i).value.trim());
  try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){}
  const cat=v.cat, isA=cat==="Anders";
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.cat===cat));
  $("model").parentElement.hidden=isA; $("color").parentElement.hidden=isA;
  $("modelOtherL").hidden=!(isA||v.model==="__other"); $("colorOtherL").hidden=!(isA||v.color==="__other");
  if(isA||v.model==="__other") v.model=v.modelOther;
  if(isA||v.color==="__other") v.color=v.colorOther;
  v.model=v.model.split(" · ")[0];
  const isMac=cat==="MacBook", hasA=cat==="iPhone"||isMac;
  $("anum").parentElement.hidden=!hasA;
  ["sim"].forEach(i=>$(i).parentElement.hidden=isMac);
  ["chip","ram","cycles"].forEach(i=>$(i).parentElement.hidden=!isMac);
  const stor=+v.storage>=1024?(+v.storage/1024)+" TB":v.storage+" GB";
  setLabel("fmi",LOCK[cat]);
  setLabel("ios",cat==="iPhone"?"iOS-versie":cat==="Samsung"?"Android-versie":isMac?"macOS-versie":"Softwareversie");
  $("mnum").placeholder=cat==="Samsung"?"SM-S918B":"";
  const w = Math.max(30, +v.w||100), h = Math.max(20, +v.h||50);
  const st = $("sticker");
  st.style.width = w+"mm"; st.style.height = h+"mm";
  const d={title:v.model+" "+v.mnum+(isMac?"":" "+stor),model:v.model,mnum:v.mnum,hasA,isMac,anum:v.anum,color:v.color,serial:v.serial,
    lock:LOCK[cat],os:OSL[cat],fmi:v.fmi,ios:v.ios,batt:v.batt,cycles:v.cycles,chip:v.chip,ram:v.ram,stor,
    spec:isMac?v.chip+" · "+v.ram+" GB RAM · "+stor+" SSD":stor,sim:v.sim,date:fmtDate(v.date),loc:v.loc,qty:v.qty,rep:v.rep,grade:v.grade};
  st.innerHTML=(LAYOUTS[v.lay]||LAYOUTS.klassiek)(d);
  try{
    JsBarcode("#bc", v.serial||" ", {format:"CODE128", displayValue:false, margin:0, height:60, width:2});
    $("bc").setAttribute("preserveAspectRatio","none");
  }catch(e){}
  document.getElementById("pageStyle").textContent = `@page{size:${w}mm ${h}mm;margin:0}`;
}
const ps = document.createElement("style"); ps.id="pageStyle"; document.head.appendChild(ps);
$("model").addEventListener("input",()=>{ fillColors(); autoA(); });
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{ $("cat").value=b.dataset.cat; fillModels(); fillColors(); autoA(); render(); }));

render();

// afbeelding opslaan
$("saveImg").addEventListener("click", async ()=>{
  const el = $("sticker");
  const w = el.offsetWidth;
  const scale = Math.max(2, 1200 / w);   // scherpe afbeelding
  const canvas = await html2canvas(el,{scale,backgroundColor:"#ffffff"});
  canvas.toBlob(async blob=>{
    const file = new File([blob],"sticker-"+($("serial").value||"iphone")+".png",{type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==="AbortError") return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  },"image/png");
});

// ---- zoeken ----
const norm=t=>String(t).toLowerCase().replace(/[^a-z0-9+]/g,"");
function allModels(){
  const r=[];
  IPHONES.forEach(m=>r.push({cat:"iPhone",name:"Apple iPhone "+m+" · "+IPH_A[m]}));
  Object.keys(SAMSUNG).forEach(m=>r.push({cat:"Samsung",name:"Samsung "+m+" · "+SM_NR[m.replace("Galaxy ","")]}));
  Object.keys(MAC).forEach(m=>r.push({cat:"MacBook",name:"Apple "+m}));
  return r;
}
function search(){
  const box=$("qres"), q=$("q").value.trim();
  if(!q){ box.innerHTML=""; return []; }
  const toks=q.toLowerCase().split(/\s+/).map(norm).filter(Boolean);
  const hits=allModels().map(o=>{
    const title=norm(o.name.split(" · ")[0]), full=norm(o.name);
    if(!toks.every(t=>full.includes(t))) return null;
    return {o,score:toks.every(t=>title.includes(t))?0:1};
  }).filter(Boolean).sort((a,b)=>a.score-b.score).slice(0,8).map(h=>h.o);
  box.innerHTML="";
  if(!hits.length){ box.innerHTML='<small style="color:var(--muted)">Niets gevonden</small>'; return hits; }
  hits.forEach(o=>{
    const b=document.createElement("button"); b.type="button";
    const [n,nr]=o.name.split(" · ");
    b.innerHTML="<span>"+esc(n)+"</span><small>"+esc(o.cat)+(nr?" · "+esc(nr):"")+"</small>";
    b.addEventListener("click",()=>pick(o));
    box.appendChild(b);
  });
  return hits;
}
function pick(o){
  $("cat").value=o.cat; fillModels(); setSel("model",o.name); fillColors(); autoA(); render();
  $("q").value=""; $("qres").innerHTML="";
  $("model").scrollIntoView({block:"center",behavior:"smooth"});
}
$("q").addEventListener("input",search);
$("q").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); const h=search(); if(h[0]) pick(h[0]); $("q").blur(); }});

$("pdf").addEventListener("click",()=>window.print());
